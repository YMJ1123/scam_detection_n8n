services:
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANTI_FRAUD_API_KEY=${ANTI_FRAUD_API_KEY}
    env_file:
      - .env
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  discord-bot:
    build: .
    env_file:
      - .env
    environment:
      # Point to n8n inside Docker network
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/anti-fraud
    depends_on:
      - n8n
    restart: unless-stopped

volumes:
  n8n_data:
